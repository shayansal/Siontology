name: ci

# The fast suite, for every push and pull request: formatting, lints, the
# tests not marked #[ignore], the independence of proof stack B, and the
# website and book builds. The slow tests run every night (nightly.yml).

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (fast suite)
        run: cargo test --workspace
      - name: Independence of proof stack B
        run: ./scripts/check-independence.sh

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MDBOOK_VERSION: "0.4.40"
    steps:
      - uses: actions/checkout@v7
      - name: The generated pages match their sources
        run: python3 site/src/build_site.py --check
      - name: Install mdBook
        run: |
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin
      - name: Build the book
        run: mdbook build docs/book
