name: pages

# Builds the static site at the root and the documentation book under /docs/,
# and deploys them to GitHub Pages.
#
# It runs only when started by hand. The site and the book are served at
# https://coldai.org/siontology, which coldai-web builds from the commit its
# projects/siontology/source.json pins, and CI's `site` job checks on every
# push that both still build. GitHub Pages is not turned on for this
# repository: turn it on (Settings, Pages, Source: GitHub Actions) before
# running this, or configure-pages fails.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MDBOOK_VERSION: "0.4.40"
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin
          mdbook --version
      - name: Build the book
        run: mdbook build docs/book
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          rm -f _site/_harness.html
          cp -r docs/book/book _site/docs
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
