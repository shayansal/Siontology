    <rect x="0" y="0" width="69" height="23"/>
    <rect x="0" y="26" width="33" height="17"/>
    <rect x="36" y="26" width="33" height="17"/>
    <rect x="0" y="46" width="15" height="12"/>
    <rect x="18" y="46" width="15" height="12"/>
    <rect x="36" y="46" width="15" height="12"/>
    <rect x="54" y="46" width="15" height="12"/>
    <rect x="0" y="61" width="6" height="8"/>
    <rect x="9" y="61" width="6" height="8"/>
    <rect x="18" y="61" width="6" height="8"/>
    <rect x="27" y="61" width="6" height="8"/>
    <rect x="36" y="61" width="6" height="8"/>
    <rect x="45" y="61" width="6" height="8"/>
    <rect x="54" y="61" width="6" height="8"/>
    <rect x="63" y="61" width="6" height="8"/>
  </g>
</svg>
