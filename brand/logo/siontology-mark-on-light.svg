<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 69 69" width="276" height="276" role="img" aria-labelledby="title desc">
  <title id="title">Siontology</title>
  <desc id="desc">The Siontology mark.</desc>
  <!-- The Fold mark: a full binary tree drawn as a partition. One World Proof
       over two, four and eight leaf proofs; each row is about 1/√2 the height
       of the row above. Master grid 69 x 69 units, gaps 3 units. -->
