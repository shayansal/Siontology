[workspace]
resolver = "2"
members = [
    "crates/sion-core",
    "crates/sion-crypto",
    "crates/sion-assurance",
    "crates/sion-lp",
    "crates/sion-clearing",
    "crates/sion-da",
    "crates/sion-consensus",
    "crates/sion-exec",
    "crates/sion-spec",
    "crates/sion-prover",
    "crates/sion-light",
    "crates/sion-memory",
    "crates/sion-net",
    "crates/sion-node",
    "crates/sion-cli",
    "crates/sion-app-core",
    "crates/sion-http",
    "crates/sion-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false
authors = ["ColdAI"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/ColdAI-org/siontology"
homepage = "https://siontology.org"

[workspace.dependencies]
# Internal crates
sion-core = { path = "crates/sion-core" }
sion-crypto = { path = "crates/sion-crypto" }
sion-assurance = { path = "crates/sion-assurance" }
sion-lp = { path = "crates/sion-lp" }
sion-clearing = { path = "crates/sion-clearing" }
sion-da = { path = "crates/sion-da" }
sion-consensus = { path = "crates/sion-consensus" }
sion-exec = { path = "crates/sion-exec" }
sion-spec = { path = "crates/sion-spec" }
sion-prover = { path = "crates/sion-prover" }
sion-light = { path = "crates/sion-light" }
sion-memory = { path = "crates/sion-memory" }
sion-net = { path = "crates/sion-net" }
sion-node = { path = "crates/sion-node" }
sion-cli = { path = "crates/sion-cli" }
sion-app-core = { path = "crates/sion-app-core" }
sion-http = { path = "crates/sion-http" }
sion-agent = { path = "crates/sion-agent" }

# Telling speech from silence in live voice: RNNoise's network, in Rust
# (BSD-3-Clause), without its command-line tool.
nnnoiseless = { version = "0.5", default-features = false }

# Hashing, encoding, errors
sha3 = "0.10"
borsh = { version = "1", features = ["derive"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
base64 = "0.22"

# Post-quantum and symmetric cryptography (pure Rust)
fips203 = "0.5"
fips204 = "0.5"
fips205 = "0.5"
chacha20poly1305 = "0.10"
# Nostr: BIP-340 signatures and secp256k1's ECDH (NIP-04, NIP-44), and
# the ChaCha20 NIP-44 encrypts with.
k256 = { version = "0.13.4", default-features = false, features = ["ecdh", "schnorr", "std"] }
chacha20 = "0.9"
zeroize = { version = "1", features = ["derive"] }

# Randomness (rand_core 0.6 matches the FIPS crates)
rand_core = { version = "0.6", features = ["getrandom"] }
rand_chacha = "0.3"

# Exact arithmetic
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
num-integer = "0.1"

# Networking between machines (sion-net). quinn 0.11.9 is the newest
# release that builds with the workspace's minimum Rust (1.80); 0.11.11 and
# later need 1.85 (.cargo/config.toml makes the resolver prefer versions
# that fit rust-version). rustls with the aws-lc-rs provider brings the
# hybrid key exchange X25519MLKEM768 and ML-DSA-44.
tokio = { version = "1.47", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
webpki = { package = "rustls-webpki", version = "0.103.16", default-features = false, features = ["aws-lc-rs", "std"] }
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }

# Interfaces
clap = { version = "4", features = ["derive", "env"] }
tiny_http = "0.12"
# QR codes drawn in the terminal (WeChat's sign-in); no image features.
qrcode = { version = "0.14.1", default-features = false }
ureq = { version = "2", default-features = false, features = ["json"] }
# Searching an agent's workspace (`search_files`) and matching paths
# (`find_files`).
regex = "1"
# Reading Word, OpenDocument and PowerPoint files (their ZIP archives'
# deflated parts) for the documents server.
miniz_oxide = "0.8"

# Testing
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
# Post-quantum signing is slow unoptimized; optimize dependencies even in debug builds.
opt-level = 1
# Line tables keep backtraces readable; full debug info made every test
# binary several times larger.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 1

[profile.release]
debug = false
# Consensus code must never wrap silently: an overflow that escaped review
# panics in release builds exactly as it does in debug builds.
overflow-checks = true
