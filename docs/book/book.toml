[book]
title = "Siontology"
description = "Documentation for Siontology, an open-source neo-blockchain: a network whose product is verified knowledge."
authors = ["ColdAI"]
language = "en"
src = "src"

[build]
build-dir = "book"
# A chapter listed in SUMMARY.md must exist; never create empty ones.
create-missing = false

[output.html]
site-url = "/docs/"
git-repository-url = "https://github.com/ColdAI-org/siontology"
edit-url-template = "https://github.com/ColdAI-org/siontology/edit/main/docs/book/{path}"
additional-css = ["theme/custom.css"]
default-theme = "light"
preferred-dark-theme = "coal"
no-section-label = false

[output.html.search]
enable = true

# Pages that moved when the agent's pages became a part of their own.
[output.html.redirect]
"/guides/agent-runtime.html" = "../agent/index.html"
"/guides/agent-teams.html" = "../agent/channels.html"
"/guides/agent-tools.html" = "../agent/tools.html"
"/guides/agent-browser.html" = "../agent/browser.html"
"/guides/agent-graphs.html" = "../agent/graphs.html"
"/guides/skills.html" = "../agent/skills.html"
"/guides/skill-permissions.html" = "../agent/skill-permissions.html"
"/guides/skill-improvement.html" = "../agent/skill-improvement.html"
